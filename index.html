
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IceWave.FM</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;
        }

        .radio {
            text-align: center;
            padding: 40px;
            border-radius: 20px;
            background: #1f2937;
            width: min(90%, 500px);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .status {
            color: #9ca3af;
            margin-bottom: 30px;
        }

        button {
            font-size: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        input[type="range"] {
            width: 200px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="radio">
        <h1>❄️ IceWave.FM</h1>

        <div class="status" id="status">
            Gotowe do odtwarzania
        </div>

        <audio id="radio" preload="none">
            <source
    src="https://desktop-iei18ib.tail59941b.ts.net/radio.mp3"
    type="audio/mpeg">
        </audio>

        <button id="playButton">▶️ Play</button>

        <br>

        <label>
            🔊
            <input
                id="volume"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="1">
        </label>
    </div>

    <script>
    const radio = document.getElementById("radio");
    const playButton = document.getElementById("playButton");
    const volume = document.getElementById("volume");
    const status = document.getElementById("status");

    let reconnectTimer = null;
    let userStopped = true;

    playButton.addEventListener("click", async () => {
        if (radio.paused) {
            userStopped = false;

            try {
                await radio.play();
                playButton.textContent = "⏸️ Pause";
                status.textContent = "📻 Gra IceWave.FM";
            } catch (error) {
                status.textContent = "❌ Nie udało się uruchomić streamu";
            }
        } else {
            userStopped = true;
            radio.pause();

            playButton.textContent = "▶️ Play";
            status.textContent = "Zatrzymano";
        }
    });

    volume.addEventListener("input", () => {
        radio.volume = volume.value;
    });

    function reconnect() {
        if (userStopped) return;

        if (reconnectTimer) {
            clearTimeout(reconnectTimer);
        }

        status.textContent = "🔄 Łączenie z IceWave.FM...";

        reconnectTimer = setTimeout(async () => {
            try {
                radio.load();
                await radio.play();

                playButton.textContent = "⏸️ Pause";
                status.textContent = "📻 Gra IceWave.FM";
            } catch (error) {
                status.textContent = "⏳ Stream niedostępny — ponawiam...";
                reconnect();
            }
        }, 1500);
    }

    radio.addEventListener("ended", reconnect);
    radio.addEventListener("error", reconnect);
    radio.addEventListener("stalled", reconnect);
    radio.addEventListener("abort", reconnect);
</script>

</body>
</html>
